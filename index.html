<script>
'use strict';
const KEY='meterMapProtoV4';
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
// เปรียบเทียบระหว่างปีงบประมาณได้ไม่เกิน 3 ปี (ผู้ใช้กำหนด 4 พ.ย. 69) — ปีงบไทย = 1 ต.ค. ปีก่อน ถึง 30 ก.ย.
const FY_MAX=3;
const FY_LABELS=['ต.ค.','พ.ย.','ธ.ค.','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'];
const TYPE={elec:{name:'ไฟฟ้า',icon:'⚡',unit:'หน่วย'},water:{name:'ประปา',icon:'💧',unit:'ลบ.ม.'}};
const PALETTE=['#1f4fd1','#d97706','#16a34a','#dc2626','#7c3aed','#0891b2','#db2777'];
const SAT='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
// มุมกล้องของข้อมูลตัวอย่าง (ค่ายสมมติกลางทุ่งนา) — ระบบจริงใช้มุมที่ผู้ดูแลตั้งไว้ใน settings.cam
const DEF_CAM={center:[100.30151,15.10032],zoom:17.2,pitch:50,bearing:0};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('th-TH');
const pad=n=>String(n).padStart(2,'0');
const curYm=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);};
function prevYm(ym){let[y,m]=ym.split('-').map(Number);m--;if(!m){m=12;y--;}return y+'-'+pad(m);}
function nextYm(ym){let[y,m]=ym.split('-').map(Number);m++;if(m>12){m=1;y++;}return y+'-'+pad(m);}
function ymLabel(ym){const[y,m]=ym.split('-').map(Number);return TH_M[m-1]+' '+pad((y+543)%100);}
function ymLong(ym){const[y,m]=ym.split('-').map(Number);return TH_MF[m-1]+' '+(y+543);}
function fyOf(ym){const[y,m]=ym.split('-').map(Number);return (m>=10?y+1:y)+543;}
function fyMonths(fy){const g=fy-543,out=[];for(let i=0;i<12;i++){const m=((9+i)%12)+1;out.push((m>=10?g-1:g)+'-'+pad(m));}return out;}
function rangeMonths(a,b){const out=[];let x=a;while(x<=b){out.push(x);x=nextYm(x);}return out;}
const r7=v=>Math.round(v*1e7)/1e7;
const rgbOf=h=>{const n=parseInt(String(h).replace('#','').padEnd(6,'0').slice(0,6),16);return[n>>16&255,n>>8&255,n&255];};
const hexA=(h,a)=>{const[r,g,b]=rgbOf(h);return `rgba(${r},${g},${b},${a})`;};
const mix=(h,w,t)=>{const x=rgbOf(h),y=rgbOf(w);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('');};

/* ---------- ข้อมูลตัวอย่าง (ค่ายสมมติกลางทุ่งนา ไม่ใช่ผังหรือพิกัดของหน่วยจริง) ----------
 โค้ดที่เปิดบน GitHub มีแค่ข้อมูลชุดนี้ ข้อมูลจริงของหน่วย (อาคาร แนวท่อ มิเตอร์) อยู่ใน Google Sheet/Drive ของหน่วยเท่านั้น
 และตัวกลางส่งให้เฉพาะผู้ที่ใส่รหัสเข้าดูแล้ว */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seed(){
 const r=rng(70);
 // วางผังเป็นเมตรรอบจุดกลาง แล้วแปลงเป็นพิกัด (x = ไปทางตะวันออก, y = ไปทางเหนือ)
 const C0=DEF_CAM.center,LM=111320,LC=LM*Math.cos(C0[1]*Math.PI/180);
 const P=(x,y)=>[r7(C0[0]+x/LC),r7(C0[1]+y/LM)];
 const rect=(cx,cy,w,h)=>[P(cx-w/2,cy+h/2),P(cx+w/2,cy+h/2),P(cx+w/2,cy-h/2),P(cx-w/2,cy-h/2)];
 const companies=[['c1','กองร้อย ก','#eab308','1111'],['c2','กองร้อย ข','#f97316','2222'],['c3','กองร้อย ค','#a855f7','3333'],['c4','กองร้อย ง','#ec4899','4444'],['c5','กองร้อย จ','#22c55e','5555']].map(([id,name,color,code])=>({id,name,color,code}));
 // [รหัส, กองร้อย, กลาง x, กลาง y, กว้าง, ยาว, สูง, ชื่อ, ประเภท]
 const B=[['b01','c1',-90,62,40,14,7,'โรงนอน กองร้อย ก','โรงนอนทหาร'],['b02','c1',-90,36,40,14,7,'อาคารกองร้อย ก',''],
  ['b03','c2',-30,62,36,12,7,'โรงนอน กองร้อย ข','โรงนอนทหาร'],['b04','c2',-30,38,36,12,7,'อาคารกองร้อย ข',''],
  ['b05','c3',30,40,30,12,7,'อาคารกองร้อย ค',''],['b06','c3',30,16,30,12,7,'โรงรถ กองร้อย ค',''],
  ['b07','c4',-90,-30,40,14,7,'โรงนอน กองร้อย ง','โรงนอนทหาร'],['b08','c4',-90,-56,40,14,7,'อาคารกองร้อย ง',''],
  ['b09','c5',-25,-42,32,16,3,'ตลาด (สมมติ)','ตลาด / ร้านค้าผู้ประกอบการ'],['b10','c5',30,-42,24,12,10,'หอถังน้ำ (สมมติ)','']];
 const blds=B.map(([id,companyId,x,y,w,h,ht,name,type])=>({id,name,companyId,type,h:ht,pts:rect(x,y,w,h)}));
 const zone=(ids,pad)=>{const bs=B.filter(b=>ids.includes(b[0]));const x0=Math.min(...bs.map(b=>b[2]-b[4]/2))-pad,x1=Math.max(...bs.map(b=>b[2]+b[4]/2))+pad,y0=Math.min(...bs.map(b=>b[3]-b[5]/2))-pad,y1=Math.max(...bs.map(b=>b[3]+b[5]/2))+pad;
  return [P(x0,y1),P(x1,y1),P(x1,y0),P(x0,y0)];};
 const shapes=[{id:'z1',kind:'zone',companyId:'c1',pts:zone(['b01','b02'],8)},{id:'z2',kind:'zone',companyId:'c4',pts:zone(['b07','b08'],8)},{id:'z3',kind:'zone',companyId:'c5',pts:zone(['b09','b10'],8)},
  {id:'pw1',kind:'water',pts:[P(-125,10),P(70,10)]},{id:'pw2',kind:'water',pts:[P(-60,85),P(-60,-75)]},{id:'pw3',kind:'water',pts:[P(5,-70),P(5,85)]}];
 // หมุดมิเตอร์ตัวอย่าง: กองร้อยละ 1 ไฟฟ้า + 1 ประปา ที่อาคารหลังแรก
 const meters=[],readings={};let ne=0,nw=0;
 const AVG={elec:[1800,1400,1300,2100,1200],water:[300,280,260,420,240]};
 companies.forEach((c,ci)=>{const b=blds.find(q=>q.companyId===c.id);if(!b)return;
  const cx=b.pts.reduce((a,p)=>a+p[0],0)/4,cy=b.pts.reduce((a,p)=>a+p[1],0)/4;
  for(const type of['elec','water']){
   const code=type==='elec'?'E'+pad(++ne):'W'+pad(++nw);
   meters.push({id:code,code,type,name:(type==='elec'?'ไฟฟ้า ':'ประปา ')+b.name+' (ตัวอย่าง)',lng:r7(cx+(type==='elec'?-0.00005:0.00005)),lat:r7(cy),companyId:c.id,bldId:b.id,account:(type==='elec'?'กฟภ. 020':'ประปา 110')+String(10000+Math.floor(r()*89999))});
   let v=Math.floor(5000+r()*40000),ym='2024-09';
   readings[code]={[ym]:{reading:v,by:'ข้อมูลตั้งต้น',at:'2024-10-01'}};
   while(ym<'2026-10'){ym=nextYm(ym);if(ym==='2026-10'&&(c.id==='c4'||c.id==='c5'))break;
    const mo=+ym.slice(5),f=type==='elec'?([3,4,5].includes(mo)?1.3:[6,7,8,9].includes(mo)?1.1:.9):([3,4,5].includes(mo)?1.15:1);
    v+=Math.round(AVG[type][ci]*f*(.88+r()*.24));readings[code][ym]={reading:v,by:c.name,at:nextYm(ym)+'-02'};}
  }});
 const d={v:3,companies,meters,blds,shapes,readings,settings:{adminCode:'9999',openYm:null,closed:false,closeDay:3,cam:null},
  log:[{at:new Date().toISOString(),who:'ระบบ',text:'สร้างข้อมูลตัวอย่าง (ค่ายสมมติ)'}]};
 applyBranches(d);return d;
}

// อาคารที่เพิ่มภายหลัง — เติมให้ข้อมูลที่บันทึกไว้แล้วในเบราว์เซอร์ (ครั้งเดียว ถ้าผู้ดูแลลบทิ้งจะไม่กลับมา)
const ADD_BLDS=[]; // ประวัติการเพิ่มอาคารของหน่วยจริงย้ายไปอยู่ในข้อมูลบน Google แล้ว (settings.addBlds) ไม่เก็บพิกัดจริงไว้ในโค้ด
function migrate(d){d.settings=d.settings||{};const done=d.settings.addBlds||0;
 ADD_BLDS.filter(a=>a.v>done).forEach(a=>{(a.blds||[]).forEach(g=>{if(d.blds.some(b=>b.id===g.id))return;const c=d.companies.find(x=>x.id===g.companyId);if(!c)return;
  const n=d.blds.filter(b=>b.companyId===g.companyId).length+1;d.blds.push({id:g.id,name:`อาคาร ${c.name} หลังที่ ${n}`,companyId:g.companyId,type:'',h:7,pts:g.pts});});
  Object.entries(a.reshape||{}).forEach(([id,pts])=>{const b=d.blds.find(x=>x.id===id);if(b)b.pts=pts;});
  (a.pipes||[]).forEach(p=>{if(!d.shapes.some(s=>s.id===p.id))d.shapes.push({id:p.id,kind:'water',pts:p.pts});});
  // แก้แนวท่อเฉพาะเมื่อผู้ดูแลยังไม่ได้แก้เส้นนั้นเอง
  Object.entries(a.repipe||{}).forEach(([id,r])=>{const s=d.shapes.find(x=>x.id===id);if(s&&JSON.stringify(s.pts)===JSON.stringify(r.from))s.pts=r.to;});
  if(a.branches&&!d.shapes.some(x=>x.br))applyBranches(d);
  if(a.dropShapes)d.shapes=d.shapes.filter(x=>!a.dropShapes.includes(x.id));
  (a.addShapes||[]).forEach(x=>{if(!d.shapes.some(y=>y.id===x.id))d.shapes.push(JSON.parse(JSON.stringify(x)));});
  if(a.rebranch)applyBranches(d);
  Object.entries(a.edits||{}).forEach(([id,e])=>{const b=d.blds.find(x=>x.id===id);if(!b)return;if(e.name&&/^อาคาร .+ หลังที่ \d+$/.test(b.name))b.name=e.name;if(e.h&&b.h===7)b.h=e.h;});
  (a.noBr||[]).forEach(id=>{const n=d.settings.noBr||(d.settings.noBr=[]);if(!n.includes(id))n.push(id);d.shapes=d.shapes.filter(x=>!(x.br&&x.auto&&x.bldId===id));});
  // ค่าที่ใส่ไว้ตอนทดสอบระบบ ไม่ใช่ของผู้ใช้
  Object.entries(a.untest||{}).forEach(([id,t])=>{const b=d.blds.find(x=>x.id===id);if(b&&b.type===t)b.type='';});});
 d.settings.addBlds=Math.max(done,...ADD_BLDS.map(a=>a.v));d.locPhotos=d.locPhotos||{};d.checks=d.checks||{};return d;}
function load(){let d=null;try{const j=localStorage.getItem(KEY);if(j)d=JSON.parse(j);}catch(e){}return d?migrate(d):migrate(seed());}

const GAS_URL='https://script.google.com/macros/s/AKfycbzj5zwphSuonYbOlkAo71A_wueQg-W63GXt9jhO_V08Rq30dsOeP8vvLh415ev9KDz1/exec';

const DEMO=/[?&]demo(?:[=&]|$)/.test(location.search),GAS=DEMO?'':GAS_URL;

const VKEY='mmView';
let viewTok=(()=>{try{const v=JSON.parse(localStorage.getItem(VKEY)||'null');return v&&v.exp>Date.now()?v.token:null;}catch(e){return null;}})();
function setViewTok(t,days){viewTok=t||null;try{t?localStorage.setItem(VKEY,JSON.stringify({token:t,exp:Date.now()+(days||30)*864e5})):localStorage.removeItem(VKEY);}catch(e){}}
const cfgOf=s=>({v:s.v,companies:s.companies,meters:s.meters,blds:s.blds,shapes:s.shapes,settings:s.settings});
const blankS=()=>({v:3,companies:[],meters:[],blds:[],shapes:[],readings:{},locPhotos:{},checks:{},settings:{openYm:null,closed:false,closeDay:3,cam:null},log:[]});
async function api(p,o={}){
 if(GAS){let r,j=null;try{r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({r:p.replace(/^\//,''),m:o.method||'GET',t:sess?.token||viewTok||'',b:o.body||null}),redirect:'follow',cache:'no-store'});}catch(_){const e=new Error('ต่ออินเทอร์เน็ตไม่ได้');e.status=0;throw e;}
  try{j=await r.json();}catch(_){}if(!j){const e=new Error('ระบบ Google ไม่ตอบ (HTTP '+r.status+')');e.status=r.status||500;throw e;}
  if(!j.ok){const e=new Error(j.error||'ผิดพลาด');e.status=j.status||500;throw e;}return j.data;}
 const h={'Content-Type':'application/json'};if(sess?.token)h.Authorization='Bearer '+sess.token;
 let r;try{r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:'no-store'});}catch(_){const e=new Error('ต่ออินเทอร์เน็ตไม่ได้');e.status=0;throw e;}
 let j=null;try{j=await r.json();}catch(_){}if(!r.ok){const e=new Error(j?.error||('HTTP '+r.status));e.status=r.status;e.data=j;throw e;}return j;}
function markSynced(){API.syncCfg=JSON.stringify(cfgOf(S));API.syncRd=JSON.parse(JSON.stringify(S.readings||{}));}
function rdDiff(){const out=[],a=API.syncRd||{},b=S.readings||{};for(const id of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[id]||{},y=b[id]||{};
 for(const ym of new Set([...Object.keys(x),...Object.keys(y)]))if(JSON.stringify(x[ym])!==JSON.stringify(y[ym]))out.push({meterId:id,ym,rec:y[ym]||null});}return out;}

const syncHtml=()=>({saving:'⏳ กำลังบันทึก…',ok:'☁️ บันทึกแล้ว',err:'⚠️ ยังไม่ได้บันทึก'}[API.sync]||'');
function schedulePush(){clearTimeout(API.t);setSync('saving');API.t=setTimeout(pushNow,600);}
async function pushNow(){if(API.busy){schedulePush();return;}API.busy=true;API.t=null;
 try{const c=JSON.stringify(cfgOf(S));
  if(c!==API.syncCfg){const r=await api('/admin/config',{method:'PUT',body:{config:cfgOf(S),etag:API.etag}});API.etag=r.etag;API.syncCfg=c;}
  const ch=rdDiff();if(ch.length){const sent=JSON.parse(JSON.stringify(S.readings));const r=await api('/admin/readings',{method:'POST',body:{changes:ch}});
   for(const id in r.photos||{})for(const ym in r.photos[id]){if(S.readings[id]?.[ym])S.readings[id][ym].photo=r.photos[id][ym];if(sent[id]?.[ym])sent[id][ym].photo=r.photos[id][ym];}
   API.syncRd=sent;}
  setSync(API.t?'saving':'ok');}
 catch(e){setSync('err');
  if(e.status===409){alert('มีการแก้ไขข้อมูลจากเครื่องอื่นระหว่างนี้ ระบบจะโหลดข้อมูลล่าสุดมาแสดง\n(การแก้ไขครั้งล่าสุดของคุณอาจต้องทำใหม่)');await loadOnline();render();}
  else if(e.status===401){alert('หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่');setSess(null);UI.page='view';await loadOnline();render();}
  else toast('บันทึกขึ้นระบบไม่สำเร็จ: '+e.message);}
 finally{API.busy=false;}}

 if(sess?.role==='admin'){if(ACC()&&!API.usersBusy)loadUsers();try{const j=await api('/admin/state');API.etag=j.etag;API.sheetUrl=j.sheetUrl||null;
   if(!j.config){API.empty=true;S=migrate(seed());S.log=[];API.syncCfg=null;API.syncRd={};}
   else{API.empty=false;S={...j.config,readings:j.readings||{},log:j.log||[],locPhotos:j.locPhotos||{},checks:j.checks||{}};const before=JSON.stringify(cfgOf(S));migrate(S);markSynced();API.syncCfg=before;if(JSON.stringify(cfgOf(S))!==before)schedulePush();}
   return;}catch(e){if(e.status===401||e.status===403)setSess(null);else{API.err=e.message;S=blankS();return;}}}
 try{const j=await api('/state');if(!j.config){API.empty=true;S=blankS();}else{API.empty=false;S={...j.config,readings:j.readings||{},log:[],locPhotos:j.locPhotos||{},checks:j.checks||{}};migrate(S);}}
 catch(e){S=blankS();if(e.status===401){if(sess)setSess(null);setViewTok(null);API.gate=true;}else API.err=e.message;}}

 const used=new Set(),gen=()=>{let c;do{c=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);}while(used.has(c));used.add(c);return c;};
 S.meters=[];S.readings={};S.companies.forEach(c=>c.code=gen());S.settings.adminCode=gen();S.log=[];

 const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1],cr=(a,b)=>a[0]*b[1]-a[1]*b[0],len=a=>Math.hypot(a[0],a[1]);
 const segX=(p,p2,q,q2)=>{const r=sub(p2,p),t=sub(q2,q),den=cr(r,t);if(Math.abs(den)<1e-9)return null;const u=cr(sub(q,p),t)/den,v=cr(sub(q,p),r)/den;return u>=0&&u<=1&&v>=0&&v<=1?u:null;};
 const ptSeg=(p,a,b)=>{const ab=sub(b,a),L2=dot(ab,ab)||1e-9,t=Math.max(0,Math.min(1,dot(sub(p,a),ab)/L2));return add(a,mul(ab,t));};
 const polys=d.blds.map(b=>({id:b.id,q:b.pts.map(toM)}));
 const edges=q=>q.map((p,i)=>[p,q[(i+1)%q.length]]);
 const inside=(p,q)=>{let c=false;for(const [a,b] of edges(q))if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c;return c;};
 // เส้นทางผ่านอาคารอื่นหรือไม่ (ยอมให้แตะปลายที่อาคารเป้าหมาย)
 const blocked=(path,selfId)=>{for(let k=0;k<path.length-1;k++){const a=path[k],b=path[k+1];const L=len(sub(b,a));if(L<.01)continue;
   const a2=add(a,mul(sub(b,a),.3/L)),b2=add(b,mul(sub(a,b),.3/L));
   for(const P of polys){if(P.id===selfId&&k===path.length-2)continue;
    if(edges(P.q).some(([e1,e2])=>segX(a2,b2,e1,e2)!==null)||inside(add(a2,mul(sub(b2,a2),.5)),P.q))return true;}}return false;};
 const mains=d.shapes.filter(x=>x.kind==='water'&&!x.br).flatMap(x=>{const q=x.pts.map(toM);return q.slice(1).map((p,i)=>[q[i],p]);});
 const out=[],skip=[],fail=[];
 const anyW=d.shapes.filter(x=>x.kind==='water'&&!(x.br&&x.auto)).flatMap(x=>{const q=x.pts.map(toM);return q.slice(1).map((p,i)=>[q[i],p]);});
 const noBr=new Set((d.settings&&d.settings.noBr)||[]);
 for(const P of polys){const q=P.q;if(noBr.has(P.id)){skip.push(P.id);continue;}
  // ติดท่อเมนอยู่แล้ว
  let near=Infinity;for(const [a,b] of anyW){for(const v of q)near=Math.min(near,len(sub(v,ptSeg(v,a,b))));for(const [e1,e2] of edges(q)){for(const v of [a,b])near=Math.min(near,len(sub(v,ptSeg(v,e1,e2))));if(segX(a,b,e1,e2)!==null)near=0;}}
  if(near<=1.5){skip.push(P.id);continue;}
  let best=null;const tryPath=(path,score)=>{if(best&&score>=best.score)return;if(blocked(path,P.id))return;best={path,score};};
  for(const [A,B] of mains){const AB=sub(B,A),L=len(AB);if(L<.5)continue;const u=mul(AB,1/L),n=[-u[1],u[0]];
   const ts=q.map(v=>dot(sub(v,A),u)),ss=q.map(v=>dot(sub(v,A),n));
   const side=Math.sign(ss.reduce((x,y)=>x+y,0))||1;
   const lo=Math.max(.8,Math.min(...ts)),hi=Math.min(L-.8,Math.max(...ts));
   if(hi-lo>=1){// แนวตั้งฉาก: กลางช่วงที่อาคารซ้อนกับท่อเมน
    for(const t of [(lo+hi)/2,lo+(hi-lo)*.25,lo+(hi-lo)*.75]){const Q=add(A,mul(u,t)),dir=mul(n,side);
     let hit=null;for(const [e1,e2] of edges(q)){const k=segX(Q,add(Q,mul(dir,400)),e1,e2);if(k!==null&&(hit===null||k<hit))hit=k;}
     if(hit===null)continue;const Bp=add(Q,mul(dir,400*hit));tryPath([Q,Bp],len(sub(Bp,Q))+(t===(lo+hi)/2?0:1.5));}}
   // หักฉาก 1 ครั้ง: จากปลายท่อเมนเดินต่อแนวเดิม แล้วเลี้ยวตั้งฉากเข้ากลางอาคาร
   const cen=mul(q.reduce((x,v)=>add(x,v),[0,0]),1/q.length),tc=dot(sub(cen,A),u);
   const tE=Math.max(0,Math.min(L,tc)),Q=add(A,mul(u,tE)),K=add(A,mul(u,tc)),dir=mul(n,Math.sign(dot(sub(cen,K),n))||1);
   if(inside(K,q)){// อาคารอยู่ในแนวท่อเมนพอดี: ต่อท่อเมนยาวออกไปจนชนผนังอาคาร
    let h2=null;for(const [e1,e2] of edges(q)){const k=segX(Q,K,e1,e2);if(k!==null&&(h2===null||k<h2))h2=k;}
    if(h2!==null){const Bp=add(Q,mul(sub(K,Q),h2));tryPath([Q,Bp],len(sub(Bp,Q))+8);}continue;}
   let hit=null;for(const [e1,e2] of edges(q)){const k=segX(K,add(K,mul(dir,400)),e1,e2);if(k!==null&&(hit===null||k<hit))hit=k;}
   if(hit!==null){const Bp=add(K,mul(dir,400*hit));tryPath(len(sub(K,Q))<.3?[Q,Bp]:[Q,K,Bp],len(sub(K,Q))+len(sub(Bp,K))+6);}}
  if(best&&best.score<=150)out.push({id:'br-'+P.id,kind:'water',br:1,auto:1,bldId:P.id,pts:best.path.map(toLL)});else fail.push(P.id);}
 return {branches:out,skip,fail};}

function saveReading(id,batch){
 const m=meter(id);if(!m||sess?.role!=='company'||m.companyId!==sess.co){alert('ไม่มีสิทธิ์กรอกมิเตอร์นี้');return false;}
 if(S.settings.closed){alert('ปิดรับข้อมูลแล้ว');return false;}
 const ym=openYm(),v=parseFloat(document.getElementById('r-'+id).value);
 if(isNaN(v)||v<0){alert(`กรอกเลขมิเตอร์ให้ถูกต้อง (${m.code}${m.room?' ห้อง '+m.room:''})`);return false;}
 const prev=rd(id,prevYm(ym));
 const who=m.room?`ห้อง ${m.room} (${m.code})\n`:'';
 if(prev&&v<prev.reading&&!confirm(who+(isRoll(prev.reading,v)?`เลขที่กรอก (${fmt(v)}) น้อยกว่าครั้งก่อน (${fmt(prev.reading)})\nระบบจะคิดว่ามิเตอร์วนรอบ = ใช้ไป ${fmt(rollU(prev.reading,v))} ${TYPE[m.type].unit}\nถ้าถูกต้องกด "ตกลง"`:`เลขที่กรอก (${fmt(v)}) น้อยกว่าครั้งก่อน (${fmt(prev.reading)})\nถ้าเปลี่ยนมิเตอร์ใหม่จริง กด "ตกลง"`)))return false;
 if(prev&&v>=prev.reading){let y=prevYm(ym);const past=[];for(let i=0;i<6;i++){const u=units(id,y);if(u!=null)past.push(u);y=prevYm(y);}
  const avg=past.length?past.reduce((a,b)=>a+b,0)/past.length:0;
  if(avg>0&&v-prev.reading>avg*3&&!confirm(who+`ใช้ไป ${fmt(v-prev.reading)} ${TYPE[m.type].unit} สูงกว่าค่าเฉลี่ย 6 เดือน (${fmt(avg)}) มากกว่า 3 เท่า\nตรวจเลขอีกครั้ง ถ้าถูกต้องกด "ตกลง"`))return false;}
 const cur=rd(id,ym);
 if(API.on){const btn=document.querySelector(`[data-save="${CSS.escape(id)}"]`);if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก…';}
  return api('/reading',{method:'POST',body:{meterId:id,ym,reading:v,photo:PENDING[id]||null}}).then(r=>{(S.readings[id]||(S.readings[id]={}))[ym]=r.rec;delete PENDING[id];if(!batch){render();toast('บันทึกแล้ว ✓');}else{const i=document.getElementById('r-'+id);if(i)i.defaultValue=i.value;}return true;})
   .catch(e=>{if(btn){btn.disabled=false;btn.textContent='บันทึก';}alert('บันทึกไม่สำเร็จ: '+e.message);if(e.status===401){setSess(null);UI.page='view';render();}return false;});}
 (S.readings[id]||(S.readings[id]={}))[ym]={reading:v,photo:PENDING[id]??cur?.photo??null,by:co(m.companyId).name,at:new Date().toISOString()};
 delete PENDING[id];
 log(co(m.companyId).name,`${cur?'แก้':'กรอก'}เลข ${m.code} เดือน ${ymLabel(ym)} = ${fmt(v)}`);
 save();if(!batch){render();toast('บันทึกแล้ว ✓');}else{const i=document.getElementById('r-'+id);if(i)i.defaultValue=i.value;}return true;}

function newMeter(type,p){const pre=type==='elec'?'E':'W';const n=Math.max(0,...S.meters.map(m=>(m.code.match(new RegExp('^'+pre+'(\\d+)$'))||[])[1]).filter(Boolean).map(Number))+1;
 const b=S.blds.find(q=>inPoly(p,q.pts)),z=S.shapes.find(s=>s.kind==='zone'&&inPoly(p,s.pts));
 const m={id:'m'+Date.now().toString(36),code:pre+pad(n),type,name:(type==='elec'?'ไฟฟ้า ':'ประปา ')+(b?b.name:'(ตั้งชื่อจุด)'),lng:p[0],lat:p[1],companyId:b?b.companyId:z?z.companyId:S.companies[0]?.id,bldId:b?b.id:'',account:''};

function initTheme(){let t=null;try{t=localStorage.getItem('mmTheme');}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';setTheme(t);}
function setTheme(t){document.documentElement.dataset.theme=t;$('#themeBtn').textContent=t==='dark'?'☀️':'🌙';}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(t);try{localStorage.setItem('mmTheme',t);}catch(e){}render();}
function setVal(sel,v){const el=$(sel);if(el&&v!=null)el.value=String(v);}

function showPending(id){const pv=document.getElementById('pv-'+id);if(!pv)return;

function handleHash(){const mk=location.hash.match(/^#\/k\/(.*)$/);
 if(mk){const bid=decodeURIComponent(mk[1]);if(!mkRooms(bid).length)return false;
  if(sess?.role==='company'&&mkRooms(bid).some(m=>m.companyId===sess.co&&!m.agg)){UI.page='company';render();setTimeout(()=>document.getElementById('mk-'+bid)?.scrollIntoView({behavior:'smooth',block:'start'}),60);}
  else selectMarket(bid);return true;}
 const mt=location.hash.match(/^#\/m\/(.+)$/);if(!mt)return false;const id=decodeURIComponent(mt[1]),m=meter(id);if(!m||m.agg)return false;
 if(sess?.role==='company'&&m.companyId===sess.co){UI.page='company';render();setTimeout(()=>document.getElementById('f-'+id)?.scrollIntoView({behavior:'smooth',block:'center'}),60);}
 else{UI.page='view';selectMeter(id);}return true;}

document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset?.urole){const c=document.getElementById('uc-'+t.dataset.urole);if(c)c.disabled=t.value==='admin';return;}
 switch(t.id){
  case 'ovType':UI.ovType=t.value;return render();
  case 'ovYear':UI.ovYear=t.value;return render();
  case 'cmpMode':UI.cmpMode=t.value;return render();
  case 'mYear':UI.mYear=t.value;return render();
  case 'mCmpMode':UI.mCmpMode=t.value;return render();
  case 'mCmpMeter':UI.mCmpMeter=t.value;return render();
  case 'drawCo':UI.drawCo=t.value;return;
  case 'drawH':UI.drawH=Math.max(2,Math.min(80,+t.value||8));return;
  case 'gridFy':UI.gridFy=+t.value;return render();
  case 'mkType':UI.mkType=t.value;return render();
  case 'mkYear':UI.mkYear=t.value;return render();
  case 'mkChartT':UI.mkChartT=t.value;if(t.value==='line'&&!UI.mkYears.length)UI.mkYears=fyList().slice(0,FY_MAX);return render();
  case 'mkBld':UI.mkBld=t.value;return render();
  case 'mkFy':UI.mkFy=+t.value;return render();
  case 'impJson':{const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.meters||!d.readings||!d.companies||!d.settings)throw 0;if(!confirm('แทนที่ข้อมูลทั้งหมดด้วยไฟล์สำรองนี้?'))return;d.blds=d.blds||[];d.shapes=d.shapes||[];d.log=d.log||[];S=d;if(API.on&&API.empty){API.empty=false;API.etag=null;API.syncCfg=null;API.syncRd={};}log('ผู้ดูแลระบบ','นำเข้าไฟล์สำรอง');save();render();toast('นำเข้าแล้ว');}catch(_){alert('ไฟล์สำรองไม่ถูกต้อง');}return;}
 }
 if(t.dataset.grp){const k={cy:'cmpYears',cc:'cmpCos',my:'mCmpYears',mky:'mkYears'}[t.dataset.grp],val=t.dataset.grp==='cc'?t.value:+t.value;
  if(t.checked&&t.dataset.grp!=='cc'&&UI[k].length>=FY_MAX){t.checked=false;toast(`เปรียบเทียบได้ไม่เกิน ${FY_MAX} ปีงบประมาณ`);return;}
  UI[k]=t.checked?[...UI[k],val]:UI[k].filter(x=>x!==val);return render();}
 if(t.dataset.layer){UI.layers[t.dataset.layer]=t.checked;return render();}
 if(t.dataset?.lp){const f=t.files[0];if(f)setLoc(t.dataset.lp,f);return;}
 if(t.id&&t.id.startsWith('p-')){const id=t.id.slice(2),f=t.files[0];if(!f)return;try{PENDING[id]=await readImg(f);}catch(_){return alert('เปิดรูปไม่ได้');}showPending(id);}
});

 const prev=rd(id,prevYm(openYm())),v=parseFloat(t.value);if(!prev||isNaN(v)){out.textContent='–';out.style.color='var(--text-primary)';return;}
 const u=rollU(prev.reading,v);out.textContent=fmt(u)+(isRoll(prev.reading,v)?' (วนรอบ)':'');out.style.color=u<0?'var(--bad)':'var(--text-primary)';});

 if(API.on){const d=$('#demoBar');if(d)d.style.display='none';$('#main').innerHTML='<div class="card"><p class="hint">กำลังโหลดข้อมูล…</p></div>';if(!API.err)await loadOnline();}

window.addEventListener('beforeunload',e=>{if(API.on&&(API.t||API.busy)){e.preventDefault();e.returnValue='';}});
boot();
